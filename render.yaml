# Render Blueprint for TalentLens: FastAPI backend + Next.js frontend.
#
# The browser calls the backend directly, so the two URLs below must match the
# public URLs Render assigns. Render uses https://<service-name>.onrender.com
# unless that name is already taken, in which case it appends a suffix. If that
# happens, update both values in the dashboard (and rebuild the frontend, since
# NEXT_PUBLIC_* values are baked in at build time).
#
# Storage: the backend uses the managed Postgres database declared at the bottom
# (DATABASE_URL is wired in automatically), so data survives deploys, restarts
# and free-tier spin-downs. Note: Render's *free* Postgres plan expires 30 days
# after creation. For long-term persistence either change the database plan to
# basic-256mb, or replace DATABASE_URL with an external Postgres URL (e.g. Neon).

services:
  - type: web
    name: talentlens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker only: the in-process evaluation queue is per-process.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: CORS_ORIGINS
        value: https://talentlens-web.onrender.com
      - key: AI_PROVIDER
        value: demo # set to "anthropic" and fill ANTHROPIC_API_KEY for live AI
      - key: ANTHROPIC_API_KEY
        sync: false # prompted in the dashboard; never committed
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: DATABASE_URL
        fromDatabase:
          name: talentlens-db
          property: connectionString
      - key: MAX_UPLOAD_MB
        value: "10"

  - type: web
    name: talentlens-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://talentlens-api.onrender.com

databases:
  - name: talentlens-db
    plan: free
    databaseName: talentlens
    user: talentlens
